name: Callidus Software
description: >-
  Callidus Software Inc. (branded CallidusCloud) was an enterprise SaaS provider of sales performance
  and lead-to-money solutions, including Enterprise Incentive Management (EIM) / sales commissions,
  configure-price-quote (CPQ), contract lifecycle management (CLM), marketing automation, sales
  enablement, learning management, and gamification. Incorporated in Delaware in 1996 and headquartered
  in Dublin, California, it went public on Nasdaq (CALD) in 2003. SAP acquired CallidusCloud for
  $2.4 billion in January 2018, rebranded parts of it (e.g. SAP Litmos for the learning suite), delisted
  the company, and later divested pieces in 2022. As an independent developer surface CallidusCloud is
  defunct — the former docs portal (docs.calliduscloud.com) no longer serves a valid TLS certificate and
  calliduscloud.com now redirects to SAP's acquired-brands page.
